# Static export to GitHub Pages.
#
# The app is a single-page static site (TanStack Start prerendered). This
# workflow builds `dist/` with `npm run build:pages` (prerender + sub-path base
# so it works from the /effect_flowerstore/ sub-path) and deploys it.
#
# IMPORTANT: GitHub Pages Source must be set to "GitHub Actions" in
# Settings → Pages. If it's "Deploy from a branch", GitHub runs its own
# `pages build and deployment` workflow that serves the branch root — which has
# no index.html — and this site 404s regardless of this workflow's deploy.
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run
# in-progress and latest queued. However, do NOT cancel in-progress runs as we
# want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build static Pages export
        run: npm run build:pages
        env:
          # GitHub Pages project site lives at /<repo>/; keep the asset base in
          # sync with the repo name so it survives renames.
          PAGES_BASE: /${{ github.event.repository.name }}/
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload the static build output only (prerendered HTML + assets)
          path: 'dist/client'
      - name: Prune stale Pages artifacts
        # deploy-pages deploys the newest uploaded "github-pages" artifact, but
        # GitHub's own `pages build and deployment` (branch source) also uploads
        # an artifact with the same name; delete all but the current run's so
        # there is never ambiguity about which one gets deployed.
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_RUN: ${{ github.run_id }}
        run: |
          IDs=$(gh api "/repos/${{ github.repository }}/actions/artifacts?name=github-pages" \
            --jq ".artifacts[] | select(.workflow_run.id != $CURRENT_RUN) | .id")
          for id in $IDs; do
            gh api -X DELETE "/repos/${{ github.repository }}/actions/artifacts/$id" >/dev/null || true
            echo "pruned artifact $id"
          done
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
